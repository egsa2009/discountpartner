name: Discount Partner — Telegram Deals

on:
  # schedule:
    # - cron: '30 13 * * *'   # 8:30 AM Bogotá (COT = UTC-5)
    # - cron: '30 17 * * *'   # 12:30 PM Bogotá
    # - cron: '30 0 * * *'    # 7:30 PM Bogotá (siguiente día UTC)
  workflow_dispatch:
    inputs:
      count:
        description: 'Número de deals'
        required: false
        default: '10'
      dry_run:
        description: 'Dry run (no envía Telegram)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # necesario para commitear sent_asins.json

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser beautifulsoup4 requests pillow --break-system-packages -q

      - name: Run pipeline
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT=${{ github.event.inputs.count || '10' }}
          DRY=${{ github.event.inputs.dry_run || 'false' }}
          if [ "$DRY" = "true" ]; then
            python run_pipeline.py --count $COUNT --dry-run
          else
            python run_pipeline.py --count $COUNT
          fi

      - name: Guardar historial de ASINs enviados
        if: success()
        run: |
          git config user.name  "Discount Partner Bot"
          git config user.email "bot@discountpartner.com"
          if [ -f sent_asins.json ]; then
            git add sent_asins.json
            git diff --cached --quiet || git commit -m "chore: actualizar historial de ASINs enviados [skip ci]"
            git push
          fi

      - name: Upload results & Instagram images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-output-${{ github.run_number }}
          path: |
            deals_output.json
            instagram_posts/
          if-no-files-found: ignore
