name: Discount Partner — Procesar URLs Manuales

on:
  workflow_dispatch:
    inputs:
      deals:
        description: 'JSON array de deals [{url, sale_price, orig_price, discount_pct}]'
        required: true
      cuenta:
        description: 'Cuenta ScraperAPI a usar (vacío = la definida en la variable SCRAPER_CUENTA)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - actual
          - nueva

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -q

      - name: Procesar deals y enviar a Telegram
        env:
          PRODUCT_DEALS:        ${{ github.event.inputs.deals }}
          SCRAPER_API_KEY:      ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_KEY_NUEVA: ${{ secrets.SCRAPER_API_KEY_NUEVA }}
          SCRAPER_CUENTA:       ${{ github.event.inputs.cuenta || vars.SCRAPER_CUENTA }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python process_urls.py

      - name: Upload resultados e imágenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-deals-${{ github.run_number }}
          path: |
            deals_output.json
            instagram_posts/
          if-no-files-found: ignore
