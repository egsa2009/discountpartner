name: Discount Partner — Procesar URLs Manuales

on:
  workflow_dispatch:
    inputs:
      deals:
        description: 'JSON array de deals [{url, sale_price, orig_price, discount_pct}]'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser beautifulsoup4 requests pillow cloudinary --break-system-packages -q

      - name: Procesar deals y enviar a Telegram + Instagram
        env:
          PRODUCT_DEALS:           ${{ github.event.inputs.deals }}
          SCRAPER_API_KEY:         ${{ secrets.SCRAPER_API_KEY }}
          AMAZON_AFFILIATE_TAG:    ${{ secrets.AMAZON_AFFILIATE_TAG }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          ZERNIO_API_KEY:          ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_IG_ACCOUNT_ID:    ${{ secrets.ZERNIO_IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:   ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:      ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:   ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python process_urls.py

      - name: Upload resultados e imágenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-deals-${{ github.run_number }}
          path: |
            deals_output.json
            instagram_posts/
          if-no-files-found: ignore
